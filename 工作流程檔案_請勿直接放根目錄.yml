name: Update Taiwan market data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch official market data
        run: |
          python - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.load(r)

          def pick(row, keys):
              for key in keys:
                  if key in row and str(row[key]).strip():
                      return row[key]
              return ""

          def price(value):
              try:
                  return float(str(value).replace(",","").strip())
              except:
                  return 0

          stocks = {}
          sources = []

          try:
              rows = get("https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL")
              for row in rows:
                  code = str(pick(row, ["Code","證券代號"])).strip()
                  if code:
                      stocks[code] = {
                          "name": str(pick(row, ["Name","證券名稱"])).strip(),
                          "market": "上市",
                          "close": price(pick(row, ["ClosingPrice","收盤價"]))
                      }
              sources.append("臺灣證券交易所")
          except Exception as e:
              print("TWSE failed:", e)

          try:
              rows = get("https://www.tpex.org.tw/openapi/v1/tpex_mainboard_quotes")
              for row in rows:
                  code = str(pick(row, ["SecuritiesCompanyCode","Code","證券代號"])).strip()
                  if code:
                      stocks[code] = {
                          "name": str(pick(row, ["CompanyName","Name","證券名稱"])).strip(),
                          "market": "上櫃",
                          "close": price(pick(row, ["Close","ClosingPrice","收盤價"]))
                      }
              sources.append("證券櫃檯買賣中心")
          except Exception as e:
              print("TPEx failed:", e)

          if not stocks:
              raise SystemExit("No market data fetched")

          payload = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "sources": sources,
              "stocks": stocks
          }
          with open("market-data.json","w",encoding="utf-8") as f:
              json.dump(payload,f,ensure_ascii=False,separators=(",",":"))
          print("stocks:", len(stocks))
          PY
      - name: Commit market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-data.json
          git diff --cached --quiet || git commit -m "Update market data"
          git push
